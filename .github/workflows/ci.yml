name: vock CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftest:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4

    - name: Enable KVM group perms
      run: |
        if [ "$(uname -m)" = "x86_64" ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
        fi

    - name: Install dependencies
      run: |
        sudo apt-get update
        # The crypto coverage test (selftest 3) drives AF_ALG from vock itself,
        # so no kcapi-tools needed.
        sudo apt-get install -y clang flex bison bc dwarves pahole libelf-dev \
                             libssl-dev kmod libncurses-dev git \
                             python3-pip python3-venv qemu-system curl

        python3 -m venv venv-virtme
        source venv-virtme/bin/activate
        pip3 install git+https://github.com/arighi/virtme-ng.git

        echo "#### INFO ####"
        clang --version | head -1
        uname -m
        if [ -w /dev/kvm ]; then
            echo "Can use KVM guest mode"
        else
            echo "Can't use KVM guest mode"
        fi
        echo "##############"

        git clone -b kcov-dataflow --depth 1 https://github.com/yskzalloc/linux.git

    - name: Install rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        # Each step is a fresh shell that does not source ~/.cargo/env.
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        # Kernel Rust toolchain for selftest 5 (Rust-for-Linux coverage):
        # the kernel needs the core library source and the bindings
        # generator on top of rustc. selftest 5 gates on `make
        # rustavailable` and SKIPs cleanly if any of this is missing.
        "$HOME/.cargo/bin/rustup" component add rust-src
        "$HOME/.cargo/bin/cargo" install bindgen-cli

    - name: Toolchain info
      run: |
        cargo --version
        rustc --version

    - name: Build vock
      run: |
        make CC=clang

    - name: vock selftest
      run: |
        source venv-virtme/bin/activate
        mkdir -p selftest-logs

        # Collect results instead of aborting on the first failure: a SKIP or a
        # single failing engine should still let the rest report. The job fails
        # at the end if anything failed -- previously the whole block ran under
        # `set +e` with no exit-code check, so CI could never go red.
        # Each test's full output goes to selftest-logs/<slug>.log (uploaded as
        # a per-test artifact) and its verdict to summary.tsv (rendered into
        # the job summary together with the reproducible raw command).
        rc=0
        run_test() {
            local slug="$1" raw="$2" title="$3"
            shift 3
            echo "::group::$title"
            "$@" 2>&1 | tee "selftest-logs/$slug.log"
            local status=${PIPESTATUS[0]}
            local verdict=PASS
            if [ $status -ne 0 ]; then
                echo "FAILED (exit $status): $title"
                verdict=FAIL
                rc=1
            fi
            # Keep the actual coverage artifacts of this test, not just its
            # stdout: they land in the kernel tree (shared cwd of the runs),
            # so harvest them into a per-test directory (created on demand)
            # that the upload step publishes alongside the log.
            mkdir -p "selftest-logs/$slug"
            for f in staging/kerncov.log staging/srccov.log staging/asmcov.log \
                     staging/coverage.html staging/coverage-*.html \
                     staging/trace.log staging/trace.syz \
                     staging/dataflow.log staging/dataflow.txt staging/dataflow.html; do
                [ -f "$f" ] && cp "$f" "selftest-logs/$slug/" || true
            done
            local line
            line=$(grep -oE 'Results: [^=]*' "selftest-logs/$slug.log" | tail -1)
            printf '%s\t%s\t%s\t%s\t%s\n' \
                "$slug" "$raw" "$verdict" "$title" "${line:-no results line}" \
                >> selftest-logs/summary.tsv
            echo "::endgroup::"
        }

        # `sudo` resets PATH via sudoers secure_path, which drops ~/.cargo/bin;
        # vock selftest would then fail to re-run make. Pass PATH through as a
        # function so it survives word-splitting, and use --no-build since the
        # binary was built in the previous step.
        as_root() { sudo env "PATH=$PATH" "$@"; }

        if [ "$(uname -m)" = "x86_64" ]; then
            ON=vng-kvm
        else
            # No nested KVM on the arm64 runners.
            ON=vng-tcg
        fi

        KSRC="--kernel-src staging --vmlinux staging/vmlinux"

        run_test test1 1 "Test 1: KCOV + syscall/syzlang engines ($ON)" \
            ./vock.bin selftest 1 -v --on $ON $KSRC

        # HW trace on the host. What CI hardware can actually exercise:
        #   * Intel PT is not available to KVM guests
        #     CVE-2024-53135
        #     https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git/commit/?id=e6716f4230a
        #   * AMD LBR is the only HW trace engine reachable on GitHub runners
        #   * arm64 runners expose no CoreSight
        # So on Intel runners this is expected to SKIP rather than trace.
        run_test test2-host 2 "Test 2.1: HW trace (host)" \
            as_root ./vock.bin selftest 2 -v --on host --no-build $KSRC

        run_test test2-guest 2 "Test 2.2: HW trace ($ON guest)" \
            ./vock.bin selftest 2 -v --on $ON $KSRC

        run_test test3 3 "Test 3: --filter + xts(aes) crypto ($ON)" \
            ./vock.bin selftest 3 -v --on $ON $KSRC

        run_test test5 5 "Test 5: Rust module coverage ($ON)" \
            ./vock.bin selftest 5 -v --on $ON $KSRC

        # kcov-dataflow needs a clang with the trace-args/trace-ret passes
        # (the kcov-dataflow LLVM fork). The distro clang has none, so on the
        # hosted runners the kernel's CONFIG_KCOV_DATAFLOW_* silently drop
        # and this test SKIPs, its verdict still shows the reason. Point
        # `--llvm /path/to/llvm-project/build/bin/` at a built fork (or
        # download a toolchain artifact from the kcov-dataflow CI) to run it.
        run_test test6 6 "Test 6: kcov-dataflow arguments + return values ($ON)" \
            ./vock.bin selftest 6 -v --on $ON $KSRC

        exit $rc

    # One artifact per test so each result is downloadable through its own
    # link from the job summary below.
    - name: Upload test 1 log
      if: always()
      id: up-test1
      uses: actions/upload-artifact@v4
      with:
        name: selftest-1-${{ matrix.arch }}
        path: |
          selftest-logs/test1.log
          selftest-logs/test1/
        if-no-files-found: ignore

    - name: Upload test 2.1 log
      if: always()
      id: up-test2-host
      uses: actions/upload-artifact@v4
      with:
        name: selftest-2-host-${{ matrix.arch }}
        path: |
          selftest-logs/test2-host.log
          selftest-logs/test2-host/
        if-no-files-found: ignore

    - name: Upload test 2.2 log
      if: always()
      id: up-test2-guest
      uses: actions/upload-artifact@v4
      with:
        name: selftest-2-guest-${{ matrix.arch }}
        path: |
          selftest-logs/test2-guest.log
          selftest-logs/test2-guest/
        if-no-files-found: ignore

    - name: Upload test 3 log
      if: always()
      id: up-test3
      uses: actions/upload-artifact@v4
      with:
        name: selftest-3-${{ matrix.arch }}
        path: |
          selftest-logs/test3.log
          selftest-logs/test3/
        if-no-files-found: ignore

    - name: Upload test 5 log
      if: always()
      id: up-test5
      uses: actions/upload-artifact@v4
      with:
        name: selftest-5-${{ matrix.arch }}
        path: |
          selftest-logs/test5.log
          selftest-logs/test5/
        if-no-files-found: ignore

    - name: Upload test 6 log
      if: always()
      id: up-test6
      uses: actions/upload-artifact@v4
      with:
        name: selftest-6-${{ matrix.arch }}
        path: |
          selftest-logs/test6.log
          selftest-logs/test6/
        if-no-files-found: ignore

    - name: Job summary
      # Renders template/ACTION.md: {{ARCH}} is substituted inline, and the
      # {{RESULT_ROWS}} / {{RAW_COMMANDS}} placeholder lines are replaced by
      # the generated table rows and the per-test raw commands. Edit the
      # template to change the summary layout; this step only fills it in.
      if: always()
      env:
        URL_TEST1: ${{ steps.up-test1.outputs.artifact-url }}
        URL_TEST2_HOST: ${{ steps.up-test2-host.outputs.artifact-url }}
        URL_TEST2_GUEST: ${{ steps.up-test2-guest.outputs.artifact-url }}
        URL_TEST3: ${{ steps.up-test3.outputs.artifact-url }}
        URL_TEST5: ${{ steps.up-test5.outputs.artifact-url }}
        URL_TEST6: ${{ steps.up-test6.outputs.artifact-url }}
        ARCH: ${{ matrix.arch }}
      run: |
        while IFS=$'\t' read -r slug raw verdict title line; do
            case "$slug" in
                test1)       url="$URL_TEST1" ;;
                test2-host)  url="$URL_TEST2_HOST" ;;
                test2-guest) url="$URL_TEST2_GUEST" ;;
                test3)       url="$URL_TEST3" ;;
                test5)       url="$URL_TEST5" ;;
                test6)       url="$URL_TEST6" ;;
                *)           url="" ;;
            esac
            icon=$([ "$verdict" = PASS ] && echo ':white_check_mark:' || echo ':x:')
            echo "| $title | $icon $verdict | $line | [download]($url) |"
        done < selftest-logs/summary.tsv > selftest-logs/rows.md

        for n in $(cut -f2 selftest-logs/summary.tsv | sort -u); do
            echo "<details><summary>selftest $n</summary>"
            echo ""
            echo '```'
            ./vock.bin selftest raw "$n"
            echo '```'
            echo "</details>"
            echo ""
        done > selftest-logs/raw.md

        while IFS= read -r tline; do
            case "$tline" in
                *'{{RESULT_ROWS}}'*)  cat selftest-logs/rows.md ;;
                *'{{RAW_COMMANDS}}'*) cat selftest-logs/raw.md ;;
                *) echo "${tline//'{{ARCH}}'/$ARCH}" ;;
            esac
        done < template/ACTION.md >> "$GITHUB_STEP_SUMMARY"

    - name: "Report"
      # The failing runs are exactly the ones whose dmesg we need.
      if: always()
      run: |
        sudo dmesg

