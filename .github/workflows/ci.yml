name: vock CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install clang flex bison bc dwarves pahole libelf-dev \
                             libssl-dev kmod libncurses-dev git \
                             python3-pip python3-venv qemu-system curl \
                             kcapi-tools # For kernel crypto subsystem coverage test

        python3 -m venv venv-virtme
        source venv-virtme/bin/activate
        pip3 install git+https://github.com/arighi/virtme-ng.git
        echo "$PWD/venv-virtme/bin" >> $GITHUB_PATH

        if [ -w /dev/kvm ]; then
          echo "VM_TARGET=vng-kvm" >> $GITHUB_ENV
        else
          echo "VM_TARGET=vng-tcg" >> $GITHUB_ENV
        fi

        clang --version | head -1
        git clone -b staging-testing --depth 1 \
          https://kernel.googlesource.com/pub/scm/linux/kernel/git/gregkh/staging

    - name: Install rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        cargo install bindgen-cli
        rustup component add rust-src

    - name: Build vock
      run: |
        make CC=clang EBPF=1

    - name: "Test 1: KCOV + syscall syzlang engines"
      run: |
        source venv-virtme/bin/activate
        ./vock selftest 1 --on $VM_TARGET --kernel-src staging

    - name: "Test 2.1: VM Guest HW + syscall syzlang engines"
      run: |
        source venv-virtme/bin/activate
        ./vock selftest 2 --on $VM_TARGET --kernel-src staging

    - name: "Test 2.2: Host HW + syscall syzlang engines"
      run: |
        sudo ./vock selftest 2 --on host --kernel-src staging

        # cd staging
        # make LLVM=1 rustavailable

