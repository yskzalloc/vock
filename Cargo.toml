[workspace]
resolver = "2"
members = [
    "vock",
    "kcov-preload",
]
# A reference checkout of the addr2line crate may sit here; keep cargo from
# treating it as a member.
exclude = [
    "addr2line",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# Minimum supported Rust version. Bound by Option::is_none_or (1.82); behind
# it sit the c"..." literal in fuzz/pseudo_syscalls.rs (1.77) and integer
# div_ceil (1.73). Declared here so cargo enforces it instead of it drifting
# away from the bound in debian/control.
rust-version = "1.82"

[profile.release]
opt-level = 2
panic = "unwind"
